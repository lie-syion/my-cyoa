<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYOA 캐릭터 생성기</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --accent:         #2a78d6;
    --accent-2:       #4a3aa7;
    --good:           #0ca30c;
    --warning:        #fab219;
    --serious:        #ec835a;
    --critical:       #d03b3b;
    --success-text:   #006300;
    --radius: 14px;
  }
  [data-theme="dark"]{
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --accent:         #3987e5;
    --accent-2:       #9085e9;
    --success-text:   #0ca30c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page-plane);
    color:var(--text-primary);
    font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-140%);
    background:var(--text-primary); color:var(--page-plane);
    padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,0.25); z-index:999; opacity:0;
    transition:transform .25s ease, opacity .25s ease; pointer-events:none;
    max-width:90vw; text-align:center;
  }
  #toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }
  .wrap{ max-width:920px; margin:0 auto; padding:20px 16px 80px; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 0 18px;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; }
  .brand .logo{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;
  }
  .theme-toggle{
    border:1px solid var(--border); background:var(--surface-1); color:var(--text-secondary);
    border-radius:999px; padding:7px 12px; font-size:13px; cursor:pointer; font-weight:600;
  }
  h1{ font-size:26px; margin:6px 0 4px; letter-spacing:-0.01em; }
  h2{ font-size:19px; margin:0 0 4px; letter-spacing:-0.01em; }
  p.lead{ color:var(--text-secondary); font-size:14.5px; line-height:1.6; margin:0 0 22px; }
  .card{
    background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:16px;
  }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .preset-card{
    background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; display:flex; flex-direction:column; gap:8px;
  }
  .preset-card .emoji{ font-size:28px; }
  .preset-card h3{ margin:2px 0 0; font-size:16.5px; }
  .preset-card p{ margin:0; color:var(--text-secondary); font-size:13.5px; line-height:1.55; flex:1; }
  .preset-card .row{ display:flex; gap:8px; margin-top:6px; }
  .btn{
    border:none; cursor:pointer; border-radius:10px; font-weight:700; font-size:14px;
    padding:10px 16px; transition:filter .15s ease, transform .05s ease;
    font-family:inherit;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-secondary{ background:transparent; color:var(--text-primary); border:1px solid var(--border); }
  .btn-secondary:hover{ background:var(--gridline); }
  .btn-ghost{ background:transparent; color:var(--text-secondary); border:1px dashed var(--border); }
  .btn-danger{ background:transparent; color:var(--critical); border:1px solid var(--border); }
  .btn-danger:hover{ background:rgba(208,59,59,0.08); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:8px; }
  .btn-block{ width:100%; }
  input[type=text], input[type=number], textarea, select{
    width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--border);
    background:var(--page-plane); color:var(--text-primary); font-family:inherit; font-size:14px;
  }
  textarea{ resize:vertical; min-height:56px; }
  label.field-label{ display:block; font-size:12.5px; font-weight:700; color:var(--text-secondary); margin:0 0 5px; }
  .field{ margin-bottom:12px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .hr{ height:1px; background:var(--gridline); border:none; margin:16px 0; }
  .muted{ color:var(--text-muted); font-size:12.5px; }
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700;
    padding:3px 9px; border-radius:999px; background:var(--gridline); color:var(--text-secondary);
  }
  /* ---- Editor ---- */
  .cat-block{ border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; background:var(--page-plane); }
  .cat-head{ display:flex; gap:10px; align-items:flex-end; margin-bottom:10px; flex-wrap:wrap; }
  .cat-head .grow{ flex:1; min-width:160px; }
  .opt-row{ display:grid; grid-template-columns:1.3fr 1.7fr 90px 40px; gap:8px; align-items:center; margin-bottom:7px; }
  .opt-row input[type=number]{ text-align:right; }
  @media (max-width:640px){ .opt-row{ grid-template-columns:1fr; } .field-row{ grid-template-columns:1fr; } }
  .icon-btn{ background:transparent; border:1px solid var(--border); border-radius:8px; cursor:pointer; color:var(--critical); font-size:14px; padding:8px; line-height:1; }
  .icon-btn:hover{ background:rgba(208,59,59,0.08); }
  .footer-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .file-btn{ position:relative; overflow:hidden; display:inline-block; }
  .file-btn input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  /* ---- Meter ---- */
  .meter-wrap{
    position:sticky; top:0; z-index:50; background:var(--page-plane);
    padding-top:10px; margin:-4px 0 18px; backdrop-filter: blur(6px);
  }
  .meter-card{ background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
  .meter-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:10px; flex-wrap:wrap; }
  .meter-num{ font-size:22px; font-weight:800; font-variant-numeric:proportional-nums; }
  .meter-status{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; }
  .meter-track{ height:10px; border-radius:999px; background:var(--gridline); overflow:hidden; position:relative; }
  .meter-fill{ height:100%; border-radius:999px; transition:width .25s ease, background .25s ease; }
  /* ---- Play ---- */
  .cat-title{ display:flex; align-items:baseline; justify-content:space-between; margin:22px 0 10px; }
  .cat-title h2{ margin:0; }
  .opt-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .opt-card{
    border:1px solid var(--border); border-radius:12px; padding:13px; cursor:pointer;
    background:var(--surface-1); transition:border-color .15s ease, background .15s ease;
  }
  .opt-card:hover{ border-color:var(--accent); }
  .opt-card.selected{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--surface-1)); box-shadow:0 0 0 1px var(--accent) inset; }
  .opt-card-top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .opt-name{ font-weight:700; font-size:14.5px; }
  .opt-cost{ font-size:12.5px; font-weight:800; white-space:nowrap; padding:2px 8px; border-radius:999px; }
  .opt-cost.pos{ background:rgba(42,120,214,0.12); color:var(--accent); }
  .opt-cost.neg{ background:rgba(12,163,12,0.12); color:var(--success-text); }
  .opt-cost.zero{ background:var(--gridline); color:var(--text-secondary); }
  .opt-desc{ color:var(--text-secondary); font-size:12.5px; margin-top:5px; line-height:1.5; }
  .name-input-row{ display:flex; gap:10px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  .name-input-row input{ max-width:320px; }
  .top-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  /* ---- Summary ---- */
  .sum-cat{ margin-bottom:16px; }
  .sum-cat h3{ font-size:14px; margin:0 0 8px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.03em; }
  .sum-item{ display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--gridline); }
  .sum-item:last-child{ border-bottom:none; }
  .sum-item .n{ font-weight:600; font-size:14px; }
  .sum-item .d{ color:var(--text-muted); font-size:12px; margin-top:2px; }
  .sum-item .c{ font-weight:700; font-size:13.5px; white-space:nowrap; }
  .total-row{ display:flex; justify-content:space-between; align-items:center; padding-top:10px; font-size:15.5px; font-weight:800; }
  /* ---- Modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; max-width:380px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .modal-msg{ font-size:14.5px; line-height:1.6; margin:0 0 18px; white-space:pre-line; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  /* ---- Images ---- */
  .img-field{ margin-top:8px; margin-bottom:4px; }
  .img-row{ display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .img-thumb-lg{ width:140px; height:90px; object-fit:cover; border-radius:10px; border:1px solid var(--border); flex-shrink:0; }
  .img-thumb-sm{ width:40px; height:40px; object-fit:cover; border-radius:8px; border:1px solid var(--border); flex-shrink:0; }
  .img-empty{ display:flex; align-items:center; justify-content:center; background:var(--gridline); color:var(--text-muted); font-size:11px; text-align:center; }
  .img-broken{ display:flex; align-items:center; justify-content:center; background:rgba(208,59,59,0.08); color:var(--critical); font-size:11px; text-align:center; line-height:1.4; padding:6px; gap:2px; flex-direction:column; }
  .cat-banner.img-broken{ height:90px; }
  .opt-card-img.img-broken{ aspect-ratio:16/10; }
  .img-controls{ display:flex; flex-direction:column; gap:6px; flex:1; min-width:160px; }
  .img-controls input[type=text]{ font-size:12.5px; padding:7px 9px; }
  .opt-edit-block{ border-top:1px dashed var(--border); padding-top:8px; margin-bottom:10px; }
  .opt-edit-block:first-of-type{ border-top:none; padding-top:0; }
  .opt-img-row{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .opt-img-row input[type=text]{ font-size:12px; padding:6px 8px; }
  .opt-link-row{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .opt-link-row input[type=text]{ flex:1; font-size:12px; padding:6px 8px; }
  .link-tag{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:var(--accent-2); margin-top:6px; }
  .cat-banner{ width:100%; max-height:180px; object-fit:cover; border-radius:12px; margin-bottom:12px; display:block; }
  .opt-card-img-wrap{ position:relative; margin:-13px -13px 10px; }
  .opt-card-img{ width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:12px 12px 0 0; display:block; }
  .sel-badge{
    position:absolute; top:8px; right:8px; background:var(--accent); color:#fff;
    width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:800; box-shadow:0 2px 8px rgba(0,0,0,0.35);
  }
  .sum-item-left{ display:flex; gap:10px; align-items:flex-start; }
  /* ---- Stat category (editor) ---- */
  .stat-edit-row{ display:grid; grid-template-columns:1.6fr 64px 64px 64px 40px; gap:8px; align-items:center; margin-bottom:7px; }
  .stat-edit-row input[type=number]{ text-align:right; }
  @media (max-width:640px){ .stat-edit-row{ grid-template-columns:1fr; } }
  /* ---- Stat category (play/summary) ---- */
  .stat-mini-meter{ margin:6px 0 16px; }
  .stat-mini-track{ height:8px; border-radius:999px; background:var(--gridline); overflow:hidden; }
  .stat-mini-fill{ height:100%; border-radius:999px; transition:width .2s ease, background .2s ease; }
  .stat-controls{ display:flex; align-items:center; gap:10px; }
  .stat-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface-1);
    color:var(--text-primary); font-size:16px; font-weight:800; cursor:pointer; line-height:1;
  }
  .stat-btn:hover:not(:disabled){ background:var(--gridline); }
  .stat-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .stat-controls-val{ min-width:24px; text-align:center; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat-name{ font-weight:700; font-size:14px; }
  .stat-val{ font-size:13px; font-weight:700; color:var(--text-secondary); }
  .stat-bar-list{ display:flex; flex-direction:column; gap:14px; }
  .stat-row-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .stat-bar-track{ height:12px; border-radius:999px; background:var(--gridline); overflow:hidden; margin-bottom:8px; }
  .stat-bar-fill{ height:100%; border-radius:999px; background:var(--accent); transition:width .2s ease; }
  .stat-number-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
  .stat-number-card{
    border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center;
    background:var(--surface-1); display:flex; flex-direction:column; gap:6px; align-items:center;
  }
  .stat-number-big{ font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent); }
  .stat-radar-wrap{ background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:14px 10px; margin-bottom:14px; }
  .stat-list{ display:flex; flex-direction:column; gap:10px; }
  .stat-list-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface-1); }
  .stat-sum-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--gridline); }
  .stat-sum-row:last-child{ border-bottom:none; }
</style>
</head>
<body>
  <div id="toast"></div>
  <div id="modalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-box" id="modalBox"></div>
  </div>
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><span class="logo">✦</span> CYOA 캐릭터 생성기</div>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 다크모드</button>
    </div>
    <div id="app"></div>
  </div>

<script>
/* ===================== 데이터 ===================== */
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function escapeHtml(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function cat(name,type,max,options){ return {id:uid('cat'), name, categoryMode:'select', type, maxSelections:max||0, image:'', options}; }
function opt(name,desc,cost){ return {id:uid('opt'), name, description:desc, cost, image:'', linkGroup:''}; }

/* ===================== 이미지 URL 처리 ===================== */
// 이미지가 안 보이는 문제의 상당수는 "보기 페이지" 링크(직접 이미지 파일 링크가 아님)를
// 이미지 URL로 사용해서 생깁니다. 자주 쓰이는 몇 가지는 자동으로 직접 링크로 변환합니다.
function normalizeImageUrl(url){
  url = (url||'').trim();
  if(!url) return url;
  let m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(m) return `https://drive.google.com/uc?export=view&id=${m[1]}`;
  m = url.match(/drive\.google\.com\/open\?id=([^&]+)/);
  if(m) return `https://drive.google.com/uc?export=view&id=${m[1]}`;
  if(/dropbox\.com\//.test(url) && /[?&]dl=0(&|$)/.test(url)) return url.replace(/([?&])dl=0(&|$)/, '$1dl=1$2');
  return url;
}
// 이미지 URL을 입력한 직후, 이 브라우저에서 실제로 불러와지는지 미리 확인해 알려줍니다.
// (에디터에서는 문제 없어 보여도, 나중에 "플레이"에서 안 보이는 경우를 예방하기 위함)
function testImageUrl(url){
  if(!url || url.startsWith('data:')) return;
  const img = new Image();
  img.onerror = ()=>{
    showToast('⚠️ 입력한 이미지 URL을 이 브라우저에서 불러오지 못했어요. 이미지 파일로 바로 연결되는 링크(.jpg/.png 등으로 끝나는 링크)인지, 사이트가 외부에서의 접근(핫링크)을 막고 있지는 않은지 확인해주세요.');
  };
  img.src = url;
}
// <img> 로딩 실패 시 깨진 이미지 아이콘 대신 눈에 보이는 안내로 교체합니다.
function handleImgError(img){
  img.onerror = null;
  const ph = document.createElement('div');
  ph.className = (img.className||'') + ' img-broken';
  ph.textContent = '이미지를 불러올 수 없어요';
  ph.title = img.src;
  if(img.parentNode) img.replaceWith(ph);
}

const PRESETS = {
  fantasy: {
    title:'판타지 모험가',
    description:'검과 마법의 세계에서 살아갈 나만의 모험가를 만들어보세요.',
    pointBudget:100, allowNegative:false,
    categories:[
      cat('종족','single',0,[
        opt('인간','균형 잡힌 능력치와 여분의 재능 하나를 얻습니다.',0),
        opt('엘프','마법에 대한 감각이 뛰어나고 몸이 날래다.',15),
        opt('드워프','튼튼한 몸과 뛰어난 손재주를 가졌다.',12),
        opt('오크','강인한 힘을 지녔지만 사교에는 서툴다.',10),
        opt('하플링','작고 재빠르며 남다른 행운을 타고났다.',8),
        opt('수인족','예민한 감각과 어둠 속 시야를 지녔다.',18),
      ]),
      cat('직업','single',0,[
        opt('전사','근접 전투와 방어에 능숙한 전선의 핵심.',20),
        opt('마법사','원소와 주문을 다루는 강력한 술사.',25),
        opt('도적','은신과 기습, 손재주에 특화된 그림자.',18),
        opt('성직자','신성한 힘으로 치유하고 축복을 내린다.',20),
        opt('음유시인','노래와 언변으로 아군을 북돋는 만능형.',15),
        opt('방랑자','정해진 틀이 없는 자유로운 모험가.',5),
      ]),
      cat('특성 · 재능','multi',3,[
        opt('강철 근육','근력 판정에 강한 보너스를 얻는다.',10),
        opt('마나 친화','마법 시전이 한결 수월해진다.',12),
        opt('은신의 달인','상대에게 들키지 않고 움직인다.',10),
        opt('불굴의 의지','정신적 압박과 공포에 저항한다.',8),
        opt('행운아','결정적인 순간에 운이 따른다.',15),
        opt('다재다능','여러 기술을 두루 다룰 수 있다.',10),

function downloadBlob(content,filename,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);

}

/* ===================== 공유 링크 (압축 + base64url, 서버/계정 불필요) ===================== */
function bytesToBase64Url(bytes){
  let binary = '';
  for(let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function base64UrlToBytes(b64url){
  let b64 = b64url.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length % 4) b64 += '=';
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
async function compressToShareCode(obj){
  const json = JSON.stringify(obj);
  if(typeof CompressionStream === 'function'){
    const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
    const buf = await new Response(stream).arrayBuffer();
    return 'gz.' + bytesToBase64Url(new Uint8Array(buf));
  }
  // 압축 API가 없는 구형 브라우저: 압축 없이 그대로 인코딩
  return 'raw.' + bytesToBase64Url(new TextEncoder().encode(json));
}
async function decompressShareCode(code){
  const dot = code.indexOf('.');
  const kind = dot>-1 ? code.slice(0,dot) : 'gz';
  const payload = dot>-1 ? code.slice(dot+1) : code;
  const bytes = base64UrlToBytes(payload);
  if(kind==='raw'){
    return new TextDecoder().decode(bytes);
  }
  if(typeof DecompressionStream !== 'function'){
    throw new Error('이 브라우저는 압축된 공유 링크를 지원하지 않습니다.');
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(buf);
}
function currentBaseUrl(){
  return location.href.split('#')[0];
}
async function buildShareLink(payload){
  const code = await compressToShareCode(payload);
  return `${currentBaseUrl()}#share=${code}`;
}

async function loadFromShareHash(){
  const m = location.hash.match(/#share=(.+)$/);
  if(!m) return false;
  try{
    const json = await decompressShareCode(decodeURIComponent(m[1]));
    const data = JSON.parse(json);
    if(data.type==='template' && data.template){
      state.template = data.template;
      state.play = { characterName:'', selections:{}, statValues:{} };
      state.screen='play';
      showToast('공유된 템플릿을 불러왔습니다!');
      return true;
    }
    if(data.type==='character' && data.template){
      state.template = data.template;
      state.play = { characterName:data.characterName||'', selections:data.selections||{}, statValues:data.statValues||{} };
      state.screen='summary';
      showToast('공유된 캐릭터를 불러왔습니다!');
      return true;
    }
  }catch(err){
    showAlert('공유 링크를 여는 중 문제가 발생했습니다: '+err.message);
  }
  return false;
}

/* ---- 이미지 업로드 (선택된 파일을 리사이즈해서 data URL로 저장) ---- */
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('이미지를 해석할 수 없습니다.'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}

/* ===================== 커뮤니티 갤러리 ===================== */
function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += ch;
      }
    } else if(ch === '"'){
      inQuotes = true;
    } else if(ch === ','){
      row.push(field); field = '';
    } else if(ch === '\r'){
      // skip, handled by following \n
    } else if(ch === '\n'){
      row.push(field); rows.push(row); row = []; field = '';
    } else {
      field += ch;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows;
}
function csvRowsToObjects(rows){
  if(rows.length===0) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1)
    .filter(r=>r.some(c=>(c||'').trim()!==''))
    .map(r=>{
      const obj = {};
      headers.forEach((h,i)=>{ obj[h] = r[i]!=null ? r[i] : ''; });
      return obj;
    });
}
function goCommunity(){

async function loadCommunityTemplates(){
  if(!COMMUNITY_SHEET_CSV_URL){
    communityState = { status:'unset', templates:[], error:'' };
    refreshCommunity();
    return;
  }
  communityState = { status:'loading', templates:communityState.templates, error:'' };
  refreshCommunity();
  try{
    const res = await fetch(COMMUNITY_SHEET_CSV_URL, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    const table = parseCsv(text);
    if(table.length===0) throw new Error('시트가 비어 있습니다.');
    // 구글 폼 질문 제목이 안내 문구와 정확히 같지 않아도 되도록, 열 제목에 핵심 단어가
    // 포함되어 있는지로 열을 찾는다 (예: "템플릿 json 파일내용(...)" → JSON 열로 인식).
    const headers = table[0].map(h=>(h||'').trim());
    const findCol = (...substrs) => headers.findIndex(h => substrs.some(s=>h.includes(s)));
    const idxJson = headers.findIndex(h => h.toLowerCase().includes('json'));
    const idxApprove = findCol('승인');
    const idxCreator = findCol('제작자');
    const idxDesc = findCol('설명');
    const idxName = headers.findIndex((h,i) => i!==idxJson && h.includes('이름'));
    if(idxJson===-1) throw new Error('열 제목에서 "JSON"이 포함된 열을 찾지 못했어요. 템플릿 JSON을 담은 열 제목을 확인해주세요.');
    if(idxApprove===-1) throw new Error('열 제목에서 "승인" 열을 찾지 못했어요. 검수용 열 제목이 "승인"인지 확인해주세요.');

    const dataRows = table.slice(1).filter(r=>r.some(c=>(c||'').trim()!==''));
    const approvedFlags = ['o','y','yes','true','승인','1','ok'];
    const approvedRows = dataRows.filter(r=>approvedFlags.includes((r[idxApprove]||'').trim().toLowerCase()));
    const parsed = approvedRows.map(r=>{
      const raw = r[idxJson] || '';
      try{
        const data = JSON.parse(raw);
        if(!data || data.type!=='template' || !data.template) return null;
        return {
          creator: (idxCreator>-1 ? (r[idxCreator]||'').trim() : '') || '익명',
          name: (idxName>-1 ? (r[idxName]||'').trim() : '') || data.template.title || '이름 없음',
          desc: (idxDesc>-1 ? (r[idxDesc]||'').trim() : '') || data.template.description || '',
          template: data.template
        };
      }catch(err){ return null; }
    }).filter(Boolean);
    communityState = { status:'loaded', templates:parsed, error:'' };
  }catch(err){
    communityState = { status:'error', templates:[], error: err.message };
  }
  refreshCommunity();
}

function importJSONFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(data.type==='template' && data.template){
        state.template = data.template;
        state.screen='editor'; render();
        showToast('템플릿을 불러왔습니다.');
      } else if(data.type==='character' && data.template){
        state.template = data.template;
        state.play = { characterName:data.characterName||'', selections:data.selections||{}, statValues:data.statValues||{} };
        state.screen='play'; render();
        showToast('캐릭터를 불러왔습니다.');
      } else {
        showAlert('알 수 없는 파일 형식입니다.');
      }
    }catch(err){
      showAlert('파일을 읽는 중 오류가 발생했습니다: '+err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
  input.value = '';
}

/* ===================== 플레이 ===================== */
function computeSpentForSelections(selections){
  let spent = 0;
  state.template.categories.forEach(c=>{
    if(c.categoryMode==='stat') return; // 스텟형은 별도의 포인트 풀을 사용
    const sel = selections[c.id] || [];
    sel.forEach(optId=>{
      const o = c.options.find(x=>x.id===optId);
      if(o) spent += o.cost;
    });
  });
  return spent;
}
/* ---- 스텟형 카테고리 ---- */
function getStatValue(catId, statId){
  const c = findCat(catId);
  const s = c.stats && c.stats.find(x=>x.id===statId);
  if(!state.play.statValues) state.play.statValues = {};
  const stored = state.play.statValues[catId] && state.play.statValues[catId][statId];
  return stored!=null ? stored : (s ? s.min : 0);
}
function setStatValue(catId, statId, value){
  if(!state.play.statValues) state.play.statValues = {};
  if(!state.play.statValues[catId]) state.play.statValues[catId] = {};
  state.play.statValues[catId][statId] = value;
}
function computeStatSpent(c){
  let spent = 0;
  (c.stats||[]).forEach(s=>{
    const v = getStatValue(c.id, s.id);
    spent += (v - s.min) * (s.cost || 1);
  });
  return spent;
}
function incStat(catId, statId){
  const c = findCat(catId);
  const s = c.stats.find(x=>x.id===statId);
  const cur = getStatValue(catId, statId);
  if(cur >= s.max){ showToast(`⚠️ "${s.name}"의 최댓값(${s.max})에 도달했습니다.`); return; }
  const cost = s.cost || 1;
  const spent = computeStatSpent(c);
  if(!c.statAllowNegative && (spent+cost) > c.statBudget){ showToast('⚠️ 스텟 포인트가 부족합니다. (이 카테고리는 예산 초과가 허용되지 않았어요)'); return; }
  setStatValue(catId, statId, cur+1);
  refreshPlay();
}
function decStat(catId, statId){
  const c = findCat(catId);
  const s = c.stats.find(x=>x.id===statId);
  const cur = getStatValue(catId, statId);
  if(cur <= s.min){ showToast(`⚠️ "${s.name}"의 최솟값(${s.min})에 도달했습니다.`); return; }
  setStatValue(catId, statId, cur-1);
  refreshPlay();
}
function computeSpent(){ return computeSpentForSelections(state.play.selections); }
function isOptionSelected(catId, optId){
  const sel = state.play.selections[catId] || [];
  return sel.includes(optId);
}
function cloneSelections(sel){ return JSON.parse(JSON.stringify(sel)); }
function applySelectInSelections(selections, cat, o){
  const arr = selections[cat.id] || (selections[cat.id]=[]);
  if(cat.type==='single'){
    if(arr[0]!==o.id) selections[cat.id] = [o.id];
  } else if(!arr.includes(o.id)){
    arr.push(o.id);
  }
}
function applyDeselectInSelections(selections, cat, o){
  selections[cat.id] = (selections[cat.id] || []).filter(id=>id!==o.id);
}
/** 같은 연동 키를 가진 옵션들을 함께 묶어 반환 (자기 자신 포함) */
function findLinkedGroup(originCat, originOpt){
  const key = (originOpt.linkGroup||'').trim();
  const group = [{cat:originCat, opt:originOpt}];
  if(key){
    state.template.categories.forEach(cat2=>{
      cat2.options.forEach(o2=>{
        if(o2.id!==originOpt.id && (o2.linkGroup||'').trim()===key){
          group.push({cat:cat2, opt:o2});
        }
      });
    });
  }
  return group;
}
function selectOption(catId, optId){
  const c = findCat(catId);
  const o = c.options.find(x=>x.id===optId);
  const budget = state.template.pointBudget;
  const allowNeg = !!state.template.allowNegative;
  const currentlySelected = isOptionSelected(catId, optId);
  const group = findLinkedGroup(c, o);

  if(currentlySelected){
    // 그룹 전체를 함께 선택 해제 (연동된 옵션이 있다면 같이 풀림)
    const trial = cloneSelections(state.play.selections);
    group.forEach(({cat,opt})=>applyDeselectInSelections(trial, cat, opt));
    state.play.selections = trial;
    if(group.length>1) showToast(`🔗 연동 해제: ${group.map(g=>g.opt.name).join(', ')}`);
  } else {
    // 직접 클릭한 옵션에 한해서만 다중 선택 최대 개수 제한을 적용 (연동으로 강제 선택되는 옵션은 제한을 넘어설 수 있음)
    if(c.type==='multi' && c.maxSelections>0){
      const curArr = state.play.selections[catId] || [];
      if(curArr.length>=c.maxSelections){ showToast(`⚠️ 최대 ${c.maxSelections}개까지 선택할 수 있습니다.`); return; }
    }
    const trial = cloneSelections(state.play.selections);
    group.forEach(({cat,opt})=>applySelectInSelections(trial, cat, opt));
    const newSpent = computeSpentForSelections(trial);
    if(!allowNeg && newSpent > budget){
      showToast(group.length>1 ? '⚠️ 연동된 옵션을 모두 선택하기엔 포인트가 부족합니다.' : '⚠️ 포인트가 부족합니다.');
      return;
    }
    state.play.selections = trial;
    if(group.length>1) showToast(`🔗 연동 선택: ${group.map(g=>g.opt.name).join(', ')}`);
  }
  refreshPlay();
}

function meterHtml(){

  let color, icon, label;
  if(remaining < 0){ color='var(--critical)'; icon='⛔'; label='예산 초과'; }
  else if(budget>0 && remaining <= budget*0.15){ color='var(--warning)'; icon='⚠️'; label='얼마 남지 않음'; }
  else { color='var(--good)'; icon='✅'; label='포인트 충분'; }

  return `
    <div class="meter-wrap">
      <div class="meter-card">
        <div class="meter-top">

            <div class="meter-num">잔여 ${remaining} <span style="font-weight:500; font-size:14px; color:var(--text-muted);">/ ${budget}pt</span></div>
          </div>
          <div class="meter-status" style="color:${color};">${icon} ${label}</div>
        </div>
        <div class="meter-track"><div class="meter-fill" style="width:${Math.round(ratio*100)}%; background:${color};"></div></div>
      </div>
    </div>
  `;
}

function renderRadarSVG(c, values){
  const stats = c.stats || [];
  const n = stats.length;
  if(n < 3){
    return `<p class="muted" style="text-align:center; padding:10px 0;">다각형 그래프는 스텟이 3개 이상일 때 표시돼요. 아래 목록에서 값을 확인하고 조절하세요.</p>`;
  }
  const size = 300, cx = size/2, cy = size/2, R = size*0.26, labelR = size*0.335;
  const angleFor = i => -Math.PI/2 + i*(2*Math.PI/n);
  const ringPts = ratio => stats.map((s,i)=>{
    const a = angleFor(i);
    return [cx + R*ratio*Math.cos(a), cy + R*ratio*Math.sin(a)];
  });
  const gridPolys = [0.25,0.5,0.75,1].map(ratio=>{
    const pts = ringPts(ratio).map(p=>p.join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" style="stroke:var(--gridline); stroke-width:1;"/>`;
  }).join('');
  const axisLines = stats.map((s,i)=>{
    const a = angleFor(i);
    const x2 = cx+R*Math.cos(a), y2 = cy+R*Math.sin(a);
    return `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" style="stroke:var(--gridline); stroke-width:1;"/>`;
  }).join('');
  const dataPts = stats.map((s,i)=>{
    const v = values[s.id];
    const ratio = s.max>s.min ? Math.max(0, Math.min(1, (v-s.min)/(s.max-s.min))) : 0;
    const a = angleFor(i);
    return [cx + R*ratio*Math.cos(a), cy + R*ratio*Math.sin(a)];
  });
  const dataPolyStr = dataPts.map(p=>p.join(',')).join(' ');
  const dataDots = dataPts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" style="fill:var(--accent);"/>`).join('');
  const labels = stats.map((s,i)=>{
    const a = angleFor(i);
    const lx = cx+labelR*Math.cos(a), ly = cy+labelR*Math.sin(a);
    const cosv = Math.cos(a);
    const anchor = cosv > 0.15 ? 'start' : (cosv < -0.15 ? 'end' : 'middle');
    return `<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle" style="font-size:11px; fill:var(--text-secondary); font-weight:700;">${escapeHtml(s.name)} (${values[s.id]})</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:320px; display:block; margin:0 auto; overflow:visible;">
    ${gridPolys}${axisLines}
    <polygon points="${dataPolyStr}" style="fill:color-mix(in srgb, var(--accent) 22%, transparent); stroke:var(--accent); stroke-width:2;"/>
    ${dataDots}
    ${labels}
  </svg>`;
}
function statBarRowHtml(c, s, value, interactive){
  const ratio = s.max>s.min ? Math.max(0, Math.min(1, (value-s.min)/(s.max-s.min))) : 0;
  return `

function renderStatCategoryBody(c, interactive){

function buildSummaryText(){
  const t = state.template;
  const spent = computeSpent();
  const lines = [];
  lines.push(`■ ${t.title || '캐릭터 시트'}`);
  lines.push(`이름: ${state.play.characterName || '(이름 없음)'}`);
  lines.push(`포인트: ${spent} / ${t.pointBudget} (잔여 ${t.pointBudget - spent})`);
  lines.push('');
  t.categories.forEach(c=>{
    if(c.categoryMode==='stat'){
      const stats = c.stats || [];
      if(stats.length===0) return;
      const statSpent = computeStatSpent(c);
      lines.push(`[${c.name} - 스텟, ${statSpent} / ${c.statBudget}pt]`);
      stats.forEach(s=>{
        lines.push(`- ${s.name}: ${getStatValue(c.id, s.id)} (범위 ${s.min}~${s.max})`);
      });
      lines.push('');
      return;
    }
    const sel = state.play.selections[c.id] || [];
    if(sel.length===0) return;
    lines.push(`[${c.name}]`);
    sel.forEach(optId=>{
      const o = c.options.find(x=>x.id===optId);
      if(!o) return;
      const costTxt = o.cost>0 ? `+${o.cost}pt` : `${o.cost}pt`;
      lines.push(`- ${o.name} (${costTxt})${o.description ? ' : '+o.description : ''}`);
    });
    lines.push('');
  });
  return lines.join('\n');
}

        <div class="sum-item">
          <div class="sum-item-left">
            ${o.image ? `<img src="${escapeHtml(o.image)}" class="img-thumb-sm" onerror="handleImgError(this)">` : ''}
            <div><div class="n">${escapeHtml(o.name)}</div>${o.description?`<div class="d">${escapeHtml(o.description)}</div>`:''}</div>
          </div>
          <div class="c" style="color:${costColor};">${costTxt}</div>
        </div>`;
    }).join('');
    return `<div class="sum-cat"><h3>${escapeHtml(c.name)}</h3>${itemsHtml}</div>`;
  }).join('') || `<p class="muted">아직 선택한 옵션이 없습니다.</p>`;

  return `
    <div class="top-actions" style="margin-bottom:14px;">
      <button class="btn btn-secondary btn-sm" onclick="state.screen='play'; render();">← 선택으로 돌아가기</button>
      <button class="btn btn-secondary btn-sm" onclick="goHome(true)">🏠 처음으로</button>
    </div>
    <div class="card">
      <h1 style="margin-bottom:2px;">${escapeHtml(state.play.characterName || '이름 없는 캐릭터')}</h1>
      <p class="muted" style="margin:0 0 14px;">${escapeHtml(t.title)}</p>
      ${catsHtml}
      <hr class="hr">
      <div class="total-row">
        <span>사용 포인트</span>
        <span style="color:${remaining<0?'var(--critical)':'var(--text-primary)'};">${spent} / ${t.pointBudget}pt ${remaining<0?`(초과 ${-remaining}pt)`:''}</span>
      </div>
    </div>
    <div class="footer-actions">
      <button class="btn btn-primary" onclick="copySummary()">📋 텍스트로 복사</button>
      <button class="btn btn-secondary" onclick="shareCharacterLink()">🔗 캐릭터 공유 링크</button>
      <button class="btn btn-secondary" onclick="downloadSummaryText()">⬇️ 텍스트 파일 저장</button>
      <button class="btn btn-secondary" onclick="downloadCharacterJSON()">💾 캐릭터 저장 (.json)</button>
      <button class="btn btn-ghost" onclick="restartCharacter()">↺ 이 템플릿으로 새 캐릭터 만들기</button>
    </div>
  `;
}
function copySummary(){
  const text = buildSummaryText();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast('클립보드에 복사했습니다!')).catch(()=>showToast('복사에 실패했습니다.'));
  } else {
    showToast('이 브라우저에서는 복사를 지원하지 않습니다.');
  }
}
function downloadSummaryText(){
  downloadText(buildSummaryText(), safeFilename(state.play.characterName)+'.txt');
  showToast('텍스트 파일을 저장했습니다.');
}
function downloadCharacterJSON(){
  downloadJSON({ type:'character', template: state.template, characterName: state.play.characterName, selections: state.play.selections, statValues: state.play.statValues }, safeFilename(state.play.characterName)+'.json');
  showToast('캐릭터 파일을 저장했습니다.');
}
function restartCharacter(){
  state.play = { characterName:'', selections:{}, statValues:{} };
  state.screen='play'; render();
}

/* ===================== 초기화 ===================== */
(async function init(){
  await loadFromShareHash();
  render();
})();
</script>
</body>
</html>
